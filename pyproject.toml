[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prisma-s-lit-review"
dynamic = ["version"]
description = "PRISMA-S aligned keyword corpus analysis for systematic literature reviews"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["PRISMA-S", "systematic review", "keyword search", "literature review", "NLP"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.0,<3",
    "openpyxl>=3.1,<4",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "matplotlib>=3.7,<4",
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.1",
]

[project.optional-dependencies]
# Higher-fidelity PDF text extraction. PyMuPDF is AGPL-3.0; keeping it optional
# lets the default install stay MIT-compatible. `extract.py` falls back to pypdf.
fast-pdf = ["PyMuPDF>=1.23"]
# OCR rung for scan-only PDFs. Uses PyMuPDF's engine; also needs the Tesseract
# binary installed on the system PATH (not a pip dependency).
ocr = ["PyMuPDF>=1.23"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "reportlab>=4.0",
]

[project.scripts]
prisma-s = "prisma_s.cli:main"
prisma-s-gui = "prisma_s.gui:main"

[project.urls]
Homepage = "https://github.com/wielgosz/PRISMA_S_Lit_Report"
"Bug Tracker" = "https://github.com/wielgosz/PRISMA_S_Lit_Report/issues"

[tool.pytest.ini_options]
# Only collect this package's tests; the desktop_runner/ and protocols/
# bundles ship their own test files with colliding basenames.
testpaths = ["tests"]
addopts = "--doctest-modules"

[tool.setuptools]
license-files = ["LICENSE", "LICENSE-CC-BY-4.0.txt"]

[tool.setuptools.dynamic]
version = { attr = "prisma_s._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["prisma_s*"]

[tool.setuptools.package-data]
"prisma_s" = ["data/*.csv", "data/*.md", "data/citation/*.md", "py.typed"]
